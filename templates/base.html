<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FTTH Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .bi {
        vertical-align: -.125em;
        fill: currentColor;
      }
      .dropdown-menu .dropdown-item.active .bi {
        color: inherit;
      }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home') }}">FTTH Tools</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('desbalanceada') }}">Rede Desbalanceada</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('balanceada') }}">Rede Balanceada</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('autonomia') }}">Autonomia Baterias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('cores') }}">Cores Cabos</a>
                    </li>
                </ul>
                <div class="form-check form-switch d-flex align-items-center ms-lg-auto">
                    <svg class="bi me-2" width="1em" height="1em"><use href="#sun-fill"></use></svg>
                    <input class="form-check-input" type="checkbox" role="switch" id="theme-switch">
                    <svg class="bi ms-2" width="1em" height="1em"><use href="#moon-stars-fill"></use></svg>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="container mt-5 py-3 text-center text-muted border-top">
        <p>&copy; 2026 FTTH Tools. Todos os direitos reservados.</p>
    </footer>

    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <symbol id="moon-stars-fill" viewBox="0 0 16 16">
        <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
        <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162h1.212a.217.217 0 0 1 .162.328l-.98.603.387 1.162a.217.217 0 0 1-.328.22l-.98-.603-.98.603a.217.217 0 0 1-.328-.22l.387-1.162-.98-.603a.217.217 0 0 1 .162-.328h1.212l.387-1.162zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.156 1.156 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.156 1.156 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774.258c.346-.115.617-.386.732-.732L13.863.1z"/>
      </symbol>
      <symbol id="sun-fill" viewBox="0 0 16 16">
        <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707z"/>
      </symbol>
    </svg>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}

    <script>
        (() => {
            'use strict'

            const getStoredTheme = () => localStorage.getItem('theme')
            const setStoredTheme = theme => localStorage.setItem('theme', theme)

            const getPreferredTheme = () => {
                const storedTheme = getStoredTheme()
                if (storedTheme) {
                    return storedTheme
                }
                return 'light' // Padrão claro
            }

            const setTheme = theme => {
                document.documentElement.setAttribute('data-bs-theme', theme)
            }

            const themeSwitch = document.getElementById('theme-switch');

            // Define o estado inicial do switch e do tema
            const currentTheme = getPreferredTheme();
            setTheme(currentTheme);
            if (themeSwitch) themeSwitch.checked = currentTheme === 'dark';

            // Adiciona o listener para a troca
            themeSwitch?.addEventListener('change', () => {
                const newTheme = themeSwitch.checked ? 'dark' : 'light';
                setStoredTheme(newTheme);
                setTheme(newTheme);
            });
        })()
    </script>
</body>
</html>

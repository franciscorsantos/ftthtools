{% extends "base.html" %}

{% block title %}Calculadora de Rede Balanceada - FTTH{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4">Simulador de Rede Balanceada</h2>

    <div class="card p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-3">
                <label for="olt_signal_bal" class="form-label">Sinal OLT (dBm):</label>
                <input type="number" id="olt_signal_bal" class="form-control" value="3.0" step="0.1" oninput="calcularRedeBalanceada()">
            </div>
            <div class="col-md-3">
                <label for="splitter_1" class="form-label">Splitter 1º Nível (CEO):</label>
                <select id="splitter_1" class="form-select" onchange="calcularRedeBalanceada()">
                    <option value="7.2">1:4 (7.2 dB)</option>
                    <option value="10.5" selected>1:8 (10.5 dB)</option>
                    <option value="13.8">1:16 (13.8 dB)</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="splitter_2" class="form-label">Splitter 2º Nível (CTO):</label>
                <select id="splitter_2" class="form-select" onchange="calcularRedeBalanceada()">
                    <option value="7.2">1:4 (7.2 dB)</option>
                    <option value="10.5" selected>1:8 (10.5 dB)</option>
                    <option value="13.8">1:16 (13.8 dB)</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="distancia_km" class="form-label">Distância Total (km):</label>
                <input type="number" id="distancia_km" class="form-control" value="5" step="0.1" oninput="calcularRedeBalanceada()">
            </div>
        </div>
        <div class="row mt-4 no-print">
            <div class="col-12"><button class="btn btn-secondary w-100" onclick="window.print()">Imprimir / Salvar PDF</button></div>
        </div>
    </div>

    <div id="resultado_card" class="card p-4 text-center">
        <h4>Sinal Estimado no Cliente</h4>
        <h2 id="resultado_sinal" class="display-4 fw-bold">-</h2>
        <p id="detalhes_perda" class="text-muted">-</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/balanceada.js') }}"></script>
{% endblock %}
